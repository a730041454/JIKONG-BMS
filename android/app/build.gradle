plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def flutterRoot = localProperties.getProperty("flutter.sdk")
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define flutter.sdk in local.properties.")
}

// 版本号（升级时改这里，versionCode 需单调递增）
def flutterVersionCode = "5"
def flutterVersionName = "1.0.5"

android {
    namespace = "com.diyi.jikong_bms_app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.diyi.jikong_bms_app"
        minSdk = 24
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    // 固定签名，保证每次 APK 可覆盖安装（keystore 由 Actions 生成并回传仓库）
    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword "jkbms123456"
            keyAlias "jikong"
            keyPassword "jkbms123456"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
